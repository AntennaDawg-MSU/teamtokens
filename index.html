<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Tokens — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="frontend/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Team Tokens</h1>
    <p class="subtitle">Enter your NetID and this week's Shibboleth code</p>

    <div id="login-error" class="status-bar error hidden"></div>

    <form id="login-form" novalidate>
      <label for="netid">NetID</label>
      <input type="text" id="netid" name="netid"
             autocomplete="username" placeholder="abc123" required>

      <label for="shibboleth">Shibboleth Code</label>
      <input type="password" id="shibboleth" name="shibboleth"
             autocomplete="off" placeholder="Enter your code" required>

      <button type="submit" class="btn btn-primary" style="width:100%" id="login-btn">
        Sign In
      </button>
    </form>

    <p class="text-sub" style="margin-top:1rem;text-align:center;font-size:.8rem">
      Administrators: use your admin Shibboleth code
    </p>
  </div>
</div>

<script type="module">
import { Auth } from './frontend/js/api.js';

const form   = document.getElementById('login-form');
const errBox = document.getElementById('login-error');
const btn    = document.getElementById('login-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.classList.add('hidden');
  btn.disabled    = true;
  btn.textContent = 'Signing in…';

  const netid      = document.getElementById('netid').value.trim();
  const shibboleth = document.getElementById('shibboleth').value;

  try {
    const user = await Auth.login(netid, shibboleth);
    if (user.role === 'administrator' || user.role === 'instructor') {
      window.location.href = 'frontend/pages/admin.html';
    } else {
      window.location.href = 'frontend/pages/dashboard.html';
    }
  } catch (err) {
    errBox.textContent = err.message;
    errBox.classList.remove('hidden');
    btn.disabled    = false;
    btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
